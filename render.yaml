# Render blueprint: New -> Blueprint -> pick this repo. Set the API key in the dashboard.
services:
  - type: web
    name: sql-agent-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_FAST_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_STRONG_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false          # entered manually in the Render dashboard, never committed
      - key: CORS_ORIGINS
        sync: false          # e.g. https://your-app.vercel.app
